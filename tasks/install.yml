---
- name: "Create pgquartz_osgroup"
  ansible.builtin.group:
    name: "{{ pgquartz_osgroup }}"
    gid: "{{ pgquartz_gid }}"
    system: "true"
    # absent removes them, any other package state (present, latest) keeps them
    state: "{{ 'absent' if pgquartz_package_state == 'absent' else 'present' }}"

- name: "Create pgquartz_user"
  ansible.builtin.user:
    name: "{{ pgquartz_osuser }}"
    group: "{{ pgquartz_osgroup }}"
    uid: "{{ pgquartz_uid }}"
    create_home: "true"
    system: "true"
    # absent removes them, any other package state (present, latest) keeps them
    state: "{{ 'absent' if pgquartz_package_state == 'absent' else 'present' }}"

- name: Get user infor for {{ pgquartz_osuser }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ pgquartz_osuser }}"
    split: ":"

- name: "~/.postgresql dir"
  ansible.builtin.file:
    path: "{{ getent_passwd[pgquartz_osuser][4] }}/.postgresql"
    state: directory
    owner: "{{ pgquartz_osuser }}"
    group: "{{ pgquartz_osgroup }}"
    mode: "0750"

- name: "Deploy certs to ~/.postgresql/"
  ansible.builtin.copy:
    dest: "{{ getent_passwd[pgquartz_osuser][4] }}/.postgresql/{{ item.name }}"
    owner: "{{ pgquartz_osuser }}"
    group: "{{ pgquartz_osgroup }}"
    mode: "{{ item.mode }}"
    content: "{{ item.content }}"
  diff: false
  loop:
    - name: root.crt
      mode: "0640"
      content: "{{ pgquartz_ca_chain }}"
    - name: "postgresql.crt"
      mode: "0640"
      content: "{{ pgquartz_cert }}"
    - name: "postgresql.key"
      mode: "0600"
      content: "{{ pgquartz_cert_key }}"
  loop_control:
    label: "{{ item.name }}"
  when: pgquartz_cert_managed

- name: Create configdir
  ansible.builtin.file:
    owner: "{{ pgquartz_osuser }}"
    group: "{{ pgquartz_osgroup }}"
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ pgquartz_configdir }}"
    - "{{ pgquartz_jobsdir }}"

- name: Copy rpm
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/tmp"
    mode: "0600"
  loop: "{{ pgquartz_local_packages }}"

- name: Install pgquartz
  ansible.builtin.package:
    name: "/tmp/{{ item }}"
    state: "{{ pgquartz_package_state }}"
  loop: "{{ pgquartz_local_packages }}"
  register: pgquartz_local_package_installed

- name: Install pgquartz
  ansible.builtin.package:
    name: "{{ item }}"
    state: "{{ pgquartz_package_state }}"
  loop: "{{ pgquartz_packages }}"
  register: pgquartz_package_installed

# Older pgvillage packages installed pgquartz in /usr/local/bin, newer ones in
# /usr/bin. With `present` an old package stays, and the jobs would run a
# binary that is not there: fail before the jobs change.
- name: Check that the pgquartz binary exists
  ansible.builtin.stat:
    path: "{{ pgquartz_bin }}"
  register: pgquartz_binary
  when:
    - pgquartz_package_state != 'absent'
    - (pgquartz_packages + pgquartz_local_packages) | length > 0

- name: Fail when the pgquartz binary is missing
  ansible.builtin.fail:
    msg: >-
      {{ pgquartz_bin }} does not exist after installing the pgquartz packages
      (state {{ pgquartz_package_state }}).
      Older pgvillage packages install pgquartz in /usr/local/bin.
      Set pgquartz_package_state: latest (once) to move to the new package,
      or set pgquartz_bin: /usr/local/bin/pgquartz to keep the old build.
  when:
    - pgquartz_binary is not skipped
    - not pgquartz_binary.stat.exists
    # In check mode a package that is not installed yet has no binary
    - not (ansible_check_mode and (pgquartz_package_installed is changed or pgquartz_local_package_installed is changed))
