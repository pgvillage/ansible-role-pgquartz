---
- name: Set cronvars
  community.general.cronvar:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    cron_file: pgquartz
  loop: "{{ pgquartz_cronvars }}"
  loop_control:
    label: "{{ item.name }}"

# With pgquartz_instances, jobs only run per instance
- name: Remove cronjobs without instance
  ansible.builtin.cron:
    cron_file: pgquartz
    user: "{{ pgquartz_osuser }}"
    name: "pgQuartz job {{ item.name }}"
    state: absent
  loop: "{{ pgquartz_jobs if pgquartz_instances | length > 0 else [] }}"
  loop_control:
    label: "{{ item.name }}"

- name: Cronjobs
  ansible.builtin.cron:
    cron_file: pgquartz
    user: "{{ pgquartz_osuser }}"
    name: "pgQuartz job {{ item.label }}"
    job: "/usr/bin/pgquartz -c '{{ item.config }}' > /dev/null"
    minute: "{{ item.minute | default('*') }}"
    hour: "{{ item.hour | default('*') }}"
    dom: "{{ item.dom | default('*') }}"
    dow: "{{ item.dow | default('*') }}"
    month: "{{ item.month | default('*') }}"
  loop: "{{ pgquartz_scheduled_jobs }}"
  loop_control:
    label: "{{ item.label }}"

- name: Remove systemd job units
  ansible.builtin.include_tasks: systemd_cleanup.yml
  vars:
    pgquartz_keep_units: []
