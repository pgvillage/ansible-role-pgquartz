---
- name: Verify
  hosts: all
  tasks:
    - name: Read the cron file
      ansible.builtin.slurp:
        src: /etc/cron.d/pgquartz
      register: cron_file

    - name: Check the cron variables and the job
      ansible.builtin.assert:
        that:
          - "'MAILTO=root' in cron_lines"
          - "'LOGFILE=/var/log/pgquartz' in cron_lines"
          - job_lines | length == 1
        fail_msg: "{{ cron_lines }}"
      vars:
        cron_lines: "{{ (cron_file.content | b64decode).splitlines() }}"
        job_lines: >-
          {{ cron_lines | select('match', "30 1 \* \* \* pgquartz /usr/bin/pgquartz -c '/etc/pgquartz/jobs/molecule.yml'") | list }}

    - name: Check the logrotate config and the log folder
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/etc/logrotate.d/pgquartz, /var/log/pgquartz]
      register: files
      failed_when: not files.stat.exists

    - name: Check that the pgquartz user exists with the configured uid
      ansible.builtin.getent:
        database: passwd
        key: pgquartz
      failed_when: getent_passwd.pgquartz[1] != '9745'

    # Run the job as cron would: a job with a shell step (pgquartz locks it in
    # the local etcd from prepare.yml)
    - name: Create the job definition of the scheduled job
      ansible.builtin.copy:
        dest: /etc/pgquartz/jobs/molecule.yml
        content: |
          parallel: 1
          workdir: /tmp
          timeout: 1m
          steps:
            touch:
              commands:
                - name: Leave a mark
                  type: shell
                  inline: echo ran > /tmp/molecule-pgquartz
        owner: pgquartz
        group: pgquartz
        mode: "0644"

    - name: Run the job like the cron entry does, as pgquartz
      become: true
      become_user: pgquartz
      ansible.builtin.command: /usr/bin/pgquartz -c /etc/pgquartz/jobs/molecule.yml
      register: job_run
      changed_when: false

    - name: Look for the mark the job leaves
      ansible.builtin.stat:
        path: /tmp/molecule-pgquartz
      register: mark_file

    - name: Check that the job ran
      ansible.builtin.assert:
        that: mark_file.stat.exists
        fail_msg: "{{ job_run.stdout_lines + job_run.stderr_lines }}"

# An old package installed pgquartz in /usr/local/bin, while the jobs run
# pgquartz_bin (/usr/bin/pgquartz). Simulate that by moving the binary away:
# the install tasks must fail with a clear message.
- name: Verify the failure when the pgquartz binary is missing
  hosts: all
  vars:
    pgquartz_cert_managed: false
  tasks:
    - name: Move the pgquartz binary away, as if an old package put it in /usr/local/bin
      ansible.builtin.command: mv /usr/bin/pgquartz /usr/local/bin/pgquartz
      changed_when: true

    - name: Run the install tasks with the binary missing
      block:
        - name: Run the install tasks of the role
          ansible.builtin.include_role:
            name: pgvillage.pgquartz
            tasks_from: install.yml

        - name: The role should have failed
          ansible.builtin.fail:
            msg: The role did not fail on the missing pgquartz binary
      rescue:
        - name: Check the failure message
          ansible.builtin.assert:
            that:
              - "'/usr/bin/pgquartz does not exist' in ansible_failed_result.msg"
              - "'pgquartz_package_state: latest' in ansible_failed_result.msg"
            fail_msg: "{{ ansible_failed_result.msg }}"
      always:
        - name: Put the pgquartz binary back
          ansible.builtin.command: mv /usr/local/bin/pgquartz /usr/bin/pgquartz
          changed_when: true
