---
- name: Verify
  hosts: all
  tasks:
    - name: Read the cron file
      ansible.builtin.slurp:
        src: /etc/cron.d/pgquartz
      register: cron_file

    - name: Check that the job is scheduled per instance only
      ansible.builtin.assert:
        that:
          - cron_lines | select('match', "30 1 \* \* \* pgquartz /usr/bin/pgquartz -c '/etc/pgquartz/instances/cluster1/molecule.yml'") | list | length == 1
          - cron_lines | select('match', "45 1 \* \* \* pgquartz /usr/bin/pgquartz -c '/etc/pgquartz/instances/cluster2/molecule.yml'") | list | length == 1
          - cron_lines | select('match', "0 2 \* \* \* pgquartz /usr/bin/pgquartz -c '/etc/pgquartz/instances/cluster1/shell.yml'") | list | length == 1
          # cluster2 only has the molecule job (jobs set per instance)
          - cron_lines | select('search', "/etc/pgquartz/instances/cluster2/shell.yml") | list | length == 0
          - cron_lines | select('search', "/etc/pgquartz/jobs/") | list | length == 0
        fail_msg: "{{ cron_lines }}"
      vars:
        cron_lines: "{{ (cron_file.content | b64decode).splitlines() }}"

    - name: Read the rendered job definitions
      ansible.builtin.slurp:
        src: "/etc/pgquartz/instances/{{ item }}/molecule.yml"
      loop: [cluster1, cluster2]
      register: rendered

    - name: Check the instance settings in the rendered job definitions
      ansible.builtin.assert:
        that:
          - job.connections.local.conn_params.port == expected_port
          - job.connections.local.conn_params.host == '/var/run/postgresql'
          - job.connections.local.conn_params.dbname == 'postgres'
          - job.etcdConfig.lockKey == item.item ~ '/molecule'
          - job.logFile == '/var/log/pgquartz/' ~ item.item
          - job.workdir == '/etc/pgquartz/jobs'
          - job.steps.query.commands[0].inline == 'select 1'
          - job.connections.local.role == 'primary'
        fail_msg: "{{ job | to_nice_yaml }}"
      loop: "{{ rendered.results }}"
      loop_control:
        label: "{{ item.item }}"
      vars:
        job: "{{ item.content | b64decode | from_yaml }}"
        expected_port: "{{ {'cluster1': '5433', 'cluster2': '5434'}[item.item] }}"

    - name: Run the shell job of cluster1 like the cron entry does, as pgquartz
      become: true
      become_user: pgquartz
      ansible.builtin.command: /usr/bin/pgquartz -c /etc/pgquartz/instances/cluster1/shell.yml
      register: job_run
      changed_when: false

    - name: Look for the mark the job leaves and its log file
      ansible.builtin.find:
        paths: [/tmp, /var/log/pgquartz/cluster1]
        patterns: ["molecule-pgquartz", "*_shell.log"]
      register: found

    - name: Check that the job ran and logged to the folder of cluster1
      ansible.builtin.assert:
        that:
          - found.files | selectattr('path', 'equalto', '/tmp/molecule-pgquartz') | list | length == 1
          - found.files | selectattr('path', 'match', '/var/log/pgquartz/cluster1/.*_shell.log') | list | length == 1
        fail_msg: "{{ job_run.stdout_lines + job_run.stderr_lines + (found.files | map(attribute='path') | list) }}"

# The role must fail clearly on what would otherwise schedule nothing, or run nothing
- name: Verify the checks of the role
  hosts: all
  vars:
    pgquartz_cert_managed: false
    pgquartz_cron_mailto: root
  tasks:
    # pgquartz starts `parallel` runners: without parallel the job would run nothing
    - name: Create a job definition without parallel
      ansible.builtin.copy:
        dest: /etc/pgquartz/jobs/noparallel.yml
        content: |
          timeout: 1m
          steps:
            touch:
              commands:
                - name: Leave a mark
                  type: shell
                  inline: echo ran > /tmp/molecule-noparallel
        mode: "0644"

    - name: Run the role with a job without parallel (rendered per instance)
      block:
        - name: Run the role
          ansible.builtin.include_role:
            name: pgvillage.pgquartz
          vars:
            pgquartz_scheduler: cron
            pgquartz_jobs: []
            pgquartz_instances:
              cluster3:
                conn_params:
                  port: 5435
                jobs:
                  - name: noparallel

        - name: The role should have failed
          ansible.builtin.fail:
            msg: The role accepted a job without parallel
      rescue:
        - name: Check that the role failed on parallel
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name is search('parallel')
              - failed_msgs is search('/etc/pgquartz/instances/cluster3/noparallel.yml has no parallel')
            fail_msg: "{{ ansible_failed_task.name }}: {{ failed_msgs }}"
          vars:
            # A loop fails with the messages of the items in results
            failed_msgs: >-
              {{ (ansible_failed_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed')
                  | map(attribute='msg') | list + [ansible_failed_result.msg | default('')]) | join(' ') }}

    - name: Run the role with an unsupported scheduler
      block:
        - name: Run the role
          ansible.builtin.include_role:
            name: pgvillage.pgquartz
          vars:
            pgquartz_scheduler: anacron

        - name: The role should have failed
          ansible.builtin.fail:
            msg: The role accepted pgquartz_scheduler anacron
      rescue:
        - name: Check that the role failed on the scheduler
          ansible.builtin.assert:
            that: ansible_failed_result.msg is search("pgquartz_scheduler 'anacron' is not supported")
            fail_msg: "{{ ansible_failed_task.name }}: {{ ansible_failed_result.msg | default('') }}"
