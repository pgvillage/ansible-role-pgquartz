---
# Tests pgquartz_instances (multi-instance) on Rocky Linux 9 and 10: every job is
# rendered and scheduled per PostgreSQL instance. Reuses prepare.yml and
# requirements.yml of the default scenario.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/../default/requirements.yml
driver:
  name: podman
platforms:
  - name: pgquartz-mi-el9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
  - name: pgquartz-mi-el10
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
provisioner:
  name: ansible
  playbooks:
    prepare: ../default/prepare.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
