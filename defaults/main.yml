---
# pgquartz

# Address cron mails job output to (used for the MAILTO cronvar in pgquartz_cronvars).
pgquartz_cron_mailto: "{{ pgquartz_osuser }}@{{ inventory_hostname }}"

# Directory holding the pgquartz configuration.
pgquartz_configdir: /etc/pgquartz
# Directory holding the pgquartz job definitions.
pgquartz_jobsdir: "{{ pgquartz_configdir }}/jobs"

# OS user that owns the pgquartz files and runs the jobs.
pgquartz_osuser: pgquartz
# OS group of pgquartz_osuser.
pgquartz_osgroup: pgquartz
# UID for pgquartz_osuser.
pgquartz_uid: 9745
# GID for pgquartz_osgroup.
pgquartz_gid: 9745

# State of the pgquartz packages (present, absent, latest, ...). pgquartz_osuser and pgquartz_osgroup are removed with
# absent, and kept (present) with any other state.
pgquartz_package_state: present
# The pgquartz binary that the cron jobs and systemd services run. The packages of the PgVillage apt repositories
# before v0.0.4 (e.g. latest) install it in /usr/local/bin.
pgquartz_bin: /usr/bin/pgquartz
# Packages to install from the configured package repositories.
pgquartz_packages:
  - pgquartz
  - git

# Local package files (relative to the role / playbook files path) to copy to /tmp and install.
pgquartz_local_packages: []

# Git repositories with job definitions to check out (used with the cron and systemd schedulers).
# Each item has:
# - url: git repository to clone
# - dest: directory to clone into
# - branch: branch / tag / commit to check out (default: master)
pgquartz_definitions: []
# - url: https://[user]:[apikey]@github.com/mannemsolutions/pgquartz_jobs.git
#   dest: "{{ pgquartz_jobsdir }}/jobs/"
#   branch: dev

# Jobs to schedule (used with the cron and systemd schedulers).
# Each item has:
# - name: job name; runs pgquartz with config {{ pgquartz_jobsdir }}/{{ name }}.yml
# - minute, hour, dom, month, dow: cron schedule fields (default: '*')
# - on_calendar: systemd OnCalendar schedule (systemd scheduler only; default: converted from the cron fields)
pgquartz_jobs: []
# This will run /etc/pgquartz/jobs/myjob.yml every day at 01:30.
#  - name: myjob
#    minute: "30"
#    hour: "1"

# Directory holding the job definitions rendered per PostgreSQL instance (see pgquartz_instances).
pgquartz_instancesdir: "{{ pgquartz_configdir }}/instances"

# PostgreSQL instances to run the jobs for (multi-instance, used with the cron and systemd schedulers).
# When empty, pgquartz_jobs run as is. When set, every job runs once per instance instead:
# {{ pgquartz_jobsdir }}/<job>.yml is rendered to {{ pgquartz_instancesdir }}/<instance>/<job>.yml with
# - conn_params of the instance combined into the conn_params of every connection of the job;
# - etcdConfig.lockKey prefixed with '<instance>/' (so instances don't block each other);
# - logFile set to the logfolder of the instance (only when the job has a logFile).
# Each item (key is the instance name) has:
# - conn_params: libpq connection parameters for the instance (e.g. port, host, service)
# - jobs: jobs to schedule for this instance, same format as pgquartz_jobs (default: pgquartz_jobs)
# - logfolder: log folder for this instance (default: {{ pgquartz_logfolder }}/<instance>)
pgquartz_instances: {}
#  cluster1:
#    conn_params:
#      port: 5433
#  cluster2:
#    conn_params:
#      port: 5434
#    jobs:
#      - name: myjob
#        minute: "45"
#        hour: "1"

# When true, deploy the certificates below to ~/.postgresql/ of pgquartz_osuser
# so that pgquartz can connect to PostgreSQL with client certificate authentication.
pgquartz_cert_managed: true

# CA chain (PEM) deployed as ~/.postgresql/root.crt.
pgquartz_ca_chain: "--- CA ---"
# Client certificate (PEM) deployed as ~/.postgresql/postgresql.crt.
pgquartz_cert: "--- CERT ---"
# Client private key (PEM) deployed as ~/.postgresql/postgresql.key.
pgquartz_cert_key: "--- KEY ---"

# Directory for pgquartz log files.
pgquartz_logfolder: /var/log/pgquartz

# Scheduler used to run the jobs; includes tasks/jobs_<pgquartz_scheduler>.yml.
# Available implementations:
# - systemd: a systemd timer and oneshot service per job (pgquartz-<job> or pgquartz-<instance>-<job>)
# - cron: an entry per job in /etc/cron.d/pgquartz
# - external: nothing is scheduled
# 'timer' is a deprecated alias of 'systemd'.
pgquartz_scheduler: systemd

# Variables set in /etc/cron.d/pgquartz (only used with the cron scheduler).
pgquartz_cronvars:
  - name: MAILTO
    value: "{{ pgquartz_cron_mailto }}"
  - name: LOGFILE
    value: "{{ pgquartz_logfolder }}"

# Content of /etc/logrotate.d/pgquartz (used with the cron and systemd schedulers).
# The second pattern covers the default log folders of pgquartz_instances.
pgquartz_logrotate_config: |
  {{ pgquartz_logfolder }}/*.log {{ pgquartz_logfolder }}/*/*.log {
      daily
      rotate 7
      copytruncate
      delaycompress
      compress
      notifempty
      missingok
      su root root
  }
